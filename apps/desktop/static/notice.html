<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Pictures come from the app's own server; the main process checks each address. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: https: http:; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Dispeaker</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #111111;
        --line-strong: rgba(255, 255, 255, 0.16);
        --fg: #ededed;
        --muted: #8a8a8a;
        --accent: #ccf200;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace;
        user-select: none;
      }
      #card {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        cursor: pointer;
        transition:
          transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #card[data-state='out'] {
        transform: translateY(14px);
        opacity: 0;
        transition-duration: 180ms;
        transition-timing-function: ease-in;
      }
      #card:hover {
        border-color: var(--accent);
      }
      #picture {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        color: var(--fg);
        font-size: 18px;
      }
      #picture img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #body {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 3px;
      }
      #title {
        overflow: hidden;
        color: var(--fg);
        font-family: system-ui, 'Segoe UI', sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #text,
      #action {
        overflow: hidden;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #text {
        color: var(--muted);
      }
      #action {
        color: var(--accent);
      }
      @media (prefers-reduced-motion: reduce) {
        #card,
        #card[data-state='out'] {
          transform: none;
          transition-property: opacity;
        }
      }
    </style>
  </head>
  <body>
    <div id="card" data-state="out" role="status">
      <div id="picture" aria-hidden="true"></div>
      <div id="body">
        <span id="title"></span>
        <span id="text"></span>
        <span id="action" hidden></span>
      </div>
    </div>
    <script src="../dist/notice.global.js"></script>
  </body>
</html>
